<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-label="Centre for Technology and Society">
  <defs>
    <linearGradient id="ctsDisperse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#9fc4ba"/>
      <stop offset="100%" stop-color="#4a9e8d"/>
    </linearGradient>
  </defs>

  <!-- Mark: matter concentrated at left, dispersing to the right.
       The centre studies whether technology concentrates power or spreads it. -->
  <g fill="url(#ctsDisperse)">
    <!-- concentrated -->
    <circle cx="8"  cy="26" r="2.9"/>
    <circle cx="14" cy="23" r="2.9"/>
    <circle cx="12" cy="32" r="2.9"/>
    <circle cx="6"  cy="35" r="2.9"/>
    <circle cx="16" cy="31" r="2.9"/>
    <circle cx="10" cy="41" r="2.9"/>
    <circle cx="17" cy="39" r="2.9"/>
    <!-- loosening -->
    <circle cx="29" cy="19" r="2.7"/>
    <circle cx="35" cy="28" r="2.7"/>
    <circle cx="27" cy="33" r="2.7"/>
    <circle cx="33" cy="42" r="2.7"/>
    <circle cx="40" cy="35" r="2.7"/>
    <!-- dispersed -->
    <circle cx="48" cy="13" r="2.5"/>
    <circle cx="58" cy="25" r="2.5"/>
    <circle cx="50" cy="38" r="2.5"/>
    <circle cx="61" cy="47" r="2.5"/>
    <circle cx="45" cy="51" r="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="82" y="28" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Technology &amp; Society</text>
  <text x="83" y="46" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="500" fill="#9fc4ba" letter-spacing="2.4">UNIVERSITY OF OXFORD</text>
</svg>
