name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # The site is served from the custom domain www.cts-oxford.org, so it
      # builds at the root with no pathprefix. src/CNAME carries the domain
      # into the build artifact, which is what keeps GitHub Pages' custom
      # domain setting from being dropped on a later deploy.
      # To go back to ranjitlall.github.io/cts-website/, restore:
      #   npx @11ty/eleventy --pathprefix="/${{ github.event.repository.name }}/"
      # and delete src/CNAME.
      - run: npx @11ty/eleventy

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
