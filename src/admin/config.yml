  # -------------------------------------------------------------- PEOPLE ---
  - name: people
    label: People
    label_singular: Person
    folder: src/content/people
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{position}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: position, label: CTS position, widget: string, required: false, hint: "e.g. Visiting Professor, Research Affiliate, Senior Advisor. Shown on the first line. Leave blank if none." }
      - { name: affiliation, label: Official position, widget: string, hint: "e.g. Professor of Economics, University of Oxford. Shown on the second line." }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Square images work best." }
      - { name: link, label: Profile page URL, widget: string, required: false }
      - { name: order, label: Display order, widget: number, default: 10, value_type: int, hint: "Lower numbers appear first." }
      - { name: body, label: Biography (optional), widget: markdown, required: false }
