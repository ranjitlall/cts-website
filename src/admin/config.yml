# ---------------------------------------------------------------------------
# Sveltia CMS configuration
#
# This file defines what collaborators see when they log in at /admin.
# Each "collection" below becomes a section in the sidebar; each "field"
# becomes a labelled box in the editing form.
#
# TO FINISH SETUP: replace YOUR-GITHUB-USERNAME/YOUR-REPO-NAME below, and
# set base_url to your deployed authenticator Worker (see README, step 5).
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME
  branch: main
  # Uncomment once your Cloudflare Worker authenticator is deployed:
  # base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev

# Where uploaded images are stored, and how they're referenced in pages
media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads

# Editors see a live preview of unsaved work
publish_mode: simple

collections:
  # NEWS AND EVENTS ARE PARKED FOR NOW.
  # To switch them back on: uncomment the two collections below, restore the
  # matching collections in eleventy.config.js, recreate src/news.njk and
  # src/events.njk, and add the nav links back into _includes/layouts/base.njk.

